spring:
  application:
    name: linkit-backend
  datasource:
    url: jdbc:h2:mem:linkit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 12h

linkit:
  frontend-base-url: ${FRONTEND_BASE_URL:http://127.0.0.1:5173}
  mail:
    from: ${MAIL_FROM:no-reply@linkit.local}
  security:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
